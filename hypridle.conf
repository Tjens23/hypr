# GRAPHITE · hypridle — ~/.config/hypr/hypridle.conf
# Makes "Lock" in the Quickshell launcher (loginctl lock-session) and SUPER+L
# open hyprlock, and locks before suspend.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# 2.5 min: dim the panel (restored on any input)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 15 min: suspend
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
