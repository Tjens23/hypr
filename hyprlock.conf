# GRAPHITE · hyprlock — matches Theme.qml
# ~/.config/hypr/hyprlock.conf

$font     = FiraCode Nerd Font
$text     = rgb(e6e6e6)
$textDim  = rgb(8a8a8a)
$surface  = rgba(2c2c2cee)
$border   = rgba(ffffff10)
$warn     = rgb(e5c07b)
$crit     = rgb(e06c75)

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    bezier = graphite, 0.2, 0.9, 0.1, 1
    animation = fadeIn, 1, 4, graphite
    animation = fadeOut, 1, 4, graphite
    animation = inputFieldDots, 1, 2, graphite
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/graphite.png
    color = rgb(141414)
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    brightness = 0.55
    contrast = 1.0
    vibrancy = 0.0
}

# clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_family = $font
    font_size = 104
    position = 0, 170
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = $textDim
    font_family = $font
    font_size = 15
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 46
    outline_thickness = 1
    rounding = 12
    outer_color = $border
    inner_color = $surface
    font_color = $text
    font_family = $font
    check_color = $warn
    fail_color = $crit
    capslock_color = $warn
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##8a8a8a">  password</span>
    fail_text = <span foreground="##e06c75">$FAIL</span>
    position = 0, -20
    halign = center
    valign = center
}

# user
label {
    monitor =
    text =   $USER
    color = $textDim
    font_family = $font
    font_size = 12
    position = 0, -80
    halign = center
    valign = center
}

# same pill as the bar's logo island
label {
    monitor =
    text = <span foreground="##ffffff"></span>  CyberCube
    color = $text
    font_family = $font
    font_size = 12
    position = 0, 36
    halign = center
    valign = bottom
}
